<style>
:root{--p:#075fcf;--pd:#06489e;--ps:#edf5ff;--g:#078746;--gs:#ecfdf3;--r:#c62828;--rs:#fff1f1;--o:#dd7400;--os:#fff5e8;--bg:#f5f8fc;--text:#172033;--muted:#667085;--border:#e3e9f1;--shadow:0 14px 40px rgba(30,55,88,.09);--seq:52px;--name:190px}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{width:100%;min-height:100%}body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.loader-screen{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#fff}.loader-box{text-align:center}.loader-logo{width:84px;height:84px;object-fit:contain;margin-bottom:15px}.spinner{width:38px;height:38px;margin:auto;border:4px solid #e5edf7;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}.loader-box p{margin-top:12px;color:var(--muted);font-size:10px;font-weight:800}.topbar{position:sticky;top:0;z-index:90;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top)) 15px 10px;background:rgba(255,255,255,.97);backdrop-filter:blur(17px);border-bottom:1px solid var(--border)}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:49px;height:49px;object-fit:contain;flex:none}.brand h1{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand p{margin-top:3px;color:var(--p);font-size:9px;font-weight:900}.logout{flex:none;border:0;border-radius:12px;padding:9px 11px;background:#f1f4f7;color:#475467;font-size:9px;font-weight:900}.main{width:100%;max-width:1400px;margin:auto;padding:16px 16px calc(60px + env(safe-area-inset-bottom))}.teacher-card{position:relative;overflow:hidden;padding:21px;color:#fff;border-radius:24px;background:radial-gradient(circle at 0 0,rgba(255,255,255,.18),transparent 35%),linear-gradient(135deg,#0870e6,#0758c6 55%,#064494);box-shadow:0 19px 45px rgba(7,95,207,.18)}.teacher-label{font-size:8px;opacity:.85;font-weight:800}.teacher-name{margin-top:5px;font-size:19px;font-weight:900}.teacher-subject{width:max-content;max-width:100%;margin-top:12px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.15);font-size:9px;font-weight:900}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px}.section-head h3{font-size:14px;font-weight:900}.section-head span{color:var(--muted);font-size:8px}.classes-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.class-card{position:relative;min-height:116px;padding:15px;text-align:right;border:1px solid var(--border);border-radius:19px;background:#fff;box-shadow:var(--shadow);transition:.2s}.class-card:active{transform:scale(.98)}.class-card.active{border-color:var(--p);box-shadow:0 0 0 3px rgba(7,95,207,.06),var(--shadow)}.class-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--p);background:var(--ps);font-size:14px;font-weight:900}.class-card h4{margin-top:9px;font-size:11px;font-weight:900}.class-card p{margin-top:4px;color:var(--muted);font-size:8px;line-height:1.6}.class-count{position:absolute;left:12px;top:12px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0 7px;border-radius:99px;background:#f4f7fa;color:#475467;font-size:8px;font-weight:900}.period-tools{display:flex;gap:7px;overflow-x:auto;padding:3px 1px 8px;scrollbar-width:none}.period-tools::-webkit-scrollbar{display:none}.period-btn{flex:none;min-height:42px;padding:0 13px;border:1px solid var(--border);border-radius:13px;background:#fff;color:#475467;font-size:8.5px;font-weight:900}.period-btn.configured{color:var(--g);border-color:#bde6ce;background:var(--gs)}.period-btn.selected{color:#fff;border-color:var(--p);background:var(--p)}.grade-info{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding:12px 13px;border:1px solid #dce9f9;border-radius:15px;background:#f4f9ff;color:#475467;font-size:8.5px;line-height:1.8}.grade-info strong{color:var(--p)}.grade-info .setup{min-height:34px;padding:0 10px;border:0;border-radius:9px;background:var(--ps);color:var(--p);font-size:8px;font-weight:900}.search{width:100%;height:46px;margin-bottom:10px;padding:0 13px;border:1px solid var(--border);border-radius:14px;outline:none;background:#fff;font-size:11px}.search:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(7,95,207,.06)}.table-wrap{position:relative;width:100%;overflow:auto;border:1px solid var(--border);border-radius:18px;background:#fff;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}.grade-table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;direction:rtl}.grade-table th,.grade-table td{height:58px;padding:7px;text-align:center;border-bottom:1px solid #edf0f4;border-left:1px solid #f0f2f5;background:#fff;font-size:9px}.grade-table th{height:52px;position:sticky;top:0;z-index:5;color:#475467;background:#f7f9fc;font-weight:900}.seq-col{position:sticky!important;right:0!important;width:var(--seq);min-width:var(--seq);max-width:var(--seq);z-index:12!important;background:#fff!important}.name-col{position:sticky!important;right:var(--seq)!important;width:var(--name);min-width:var(--name);max-width:var(--name);z-index:11!important;text-align:right!important;background:#fff!important;box-shadow:-6px 0 12px rgba(26,50,80,.04)}thead .seq-col,thead .name-col{background:#f7f9fc!important;z-index:20!important}.student-name{font-size:9px;font-weight:900;line-height:1.5}.student-code{margin-top:2px;color:#98a2b3;font-size:7px;direction:ltr}.score-col{width:105px;min-width:105px}.total-col{width:110px;min-width:110px;background:#f4f9ff!important;color:var(--p);font-weight:900}.total-col.fail{color:var(--r)!important;background:var(--rs)!important}.score-input{width:72px;height:38px;padding:0 5px;border:1px solid #dfe5ec;border-radius:10px;outline:none;text-align:center;direction:ltr;background:#fff;font-size:12px;font-weight:900}.score-input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(7,95,207,.05)}.score-input.invalid{border-color:var(--r);background:var(--rs);color:var(--r)}.column-title{display:block;font-size:8px;font-weight:900}.column-max{display:block;margin-top:3px;color:var(--muted);font-size:7px;direction:ltr}.save-bar{position:sticky;bottom:10px;z-index:50;display:flex;gap:8px;margin-top:12px;padding:8px;border:1px solid var(--border);border-radius:17px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);box-shadow:0 14px 35px rgba(30,55,88,.13)}.save-btn{flex:1;height:49px;border:0;border-radius:14px;color:#fff;background:var(--p);font-size:10px;font-weight:900}.reload-btn{width:50px;border:0;border-radius:14px;background:#f1f4f7;color:#475467;font-size:18px}.empty{padding:30px 15px;text-align:center;border:1px solid var(--border);border-radius:18px;background:#fff;color:var(--muted);font-size:9px;line-height:1.8}.modal{display:none;position:fixed;inset:0;z-index:10000;align-items:flex-end;justify-content:center;background:rgba(17,32,51,.48);backdrop-filter:blur(5px)}.modal.show{display:flex}.modal-card{width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:19px 16px max(20px,env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:#fff;box-shadow:0 -20px 60px rgba(0,0,0,.16);animation:modalUp .3s cubic-bezier(.16,1,.3,1)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.modal-head h3{font-size:15px;font-weight:900}.close{width:35px;height:35px;border:0;border-radius:11px;background:#f1f4f7;color:#475467;font-size:17px}.modal-desc{color:var(--muted);font-size:9px;line-height:1.8;margin-bottom:14px}.component-list{display:grid;gap:8px}.component-item{display:grid;grid-template-columns:34px 1fr 90px;align-items:center;gap:8px;padding:10px;border:1px solid var(--border);border-radius:14px;background:#fff}.component-check{width:21px;height:21px;accent-color:var(--p)}.component-name{font-size:10px;font-weight:900}.max-input{width:100%;height:40px;border:1px solid var(--border);border-radius:11px;outline:none;text-align:center;direction:ltr;font-size:12px;font-weight:900}.max-input:disabled{opacity:.45;background:#f5f6f7}.formula-total{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:13px;border-radius:14px;background:#f7f9fc;font-size:10px;font-weight:900}.formula-total strong{font-size:16px;direction:ltr}.formula-total.valid{background:var(--gs);color:var(--g)}.formula-total.invalid{background:var(--rs);color:var(--r)}.modal-save{width:100%;height:50px;margin-top:13px;border:0;border-radius:14px;background:var(--p);color:#fff;font-size:10px;font-weight:900}.toast{position:fixed;z-index:30000;left:15px;right:15px;bottom:max(20px,env(safe-area-inset-bottom));max-width:430px;margin:auto;padding:12px 14px;text-align:center;border-radius:14px;background:#172033;color:#fff;font-size:9px;font-weight:800;opacity:0;pointer-events:none;transform:translateY(10px);transition:.25s}.toast.show{opacity:1;transform:none}@keyframes spin{to{transform:rotate(360deg)}}@keyframes modalUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@media(min-width:700px){.classes-grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center;padding:20px}.modal-card{border-radius:25px}}@media(max-width:390px){:root{--name:155px}.main{padding:11px 9px 80px}}
</style></head>
<body>
<div id="loaderScreen" class="loader-screen"><div class="loader-box"><img src="logo.png" class="loader-logo" alt=""><div class="spinner"></div><p>جاري تحميل منصة الأستاذ</p></div></div>
<header class="topbar"><div class="brand"><img src="logo.png" class="logo" alt=""><div><h1>مدرسة التحدي الأهلية المختلطة</h1><p>منصة الأستاذ</p></div></div><button id="logoutBtn" class="logout" type="button">خروج</button></header>
<main class="main"><section class="teacher-card"><div class="teacher-label">الأستاذ</div><div id="teacherName" class="teacher-name">—</div><div id="teacherSubject" class="teacher-subject">المادة: —</div></section><div class="section-head"><h3>الصفوف والمواد المسندة إليك</h3><span>حسب إعدادات الإدارة</span></div><section id="classesGrid" class="classes-grid"></section>
<section id="gradesSection" class="hidden"><div class="section-head"><h3 id="selectedClassTitle">درجات الصف</h3><span id="studentCount">0 طالب</span></div><div id="periodTools" class="period-tools"></div><div id="formulaInfo" class="grade-info"></div><input id="searchInput" class="search" type="search" placeholder="بحث باسم الطالب أو الكود..." autocomplete="off"><div id="tableArea"></div><div class="save-bar"><button id="saveGradesBtn" class="save-btn" type="button">حفظ درجات الصف</button><button id="reloadBtn" class="reload-btn" type="button" title="إعادة تحميل">↻</button></div></section></main>
<div id="formulaModal" class="modal"><div class="modal-card"><div class="modal-head"><h3 id="formulaModalTitle">تقسيم الدرجة</h3><button id="closeFormulaModal" class="close" type="button">×</button></div><p id="formulaModalDesc" class="modal-desc"></p><div id="componentList" class="component-list"></div><div id="formulaTotal" class="formula-total"><span>مجموع الدرجات</span><strong>0</strong></div><button id="saveFormulaBtn" class="modal-save" type="button">اعتماد التقسيم</button></div></div><div id="toast" class="toast"></div>
<script>
const DB="https://tahadi-school-default-rtdb.europe-west1.firebasedatabase.app",PERIODS={term1:{label:"الفصل الأول"},midyear:{label:"نصف السنة"},term2:{label:"الفصل الثاني"},finalExam:{label:"الامتحان النهائي"},secondRound:{label:"الدور الثاني"}},COMPONENTS=[["grammar","قواعد"],["literature","أدب"],["composition","إنشاء"],["oral","شفهي"],["practical","عملي"],["drawing","رسم"],["preparation","تحضير"],["homework","واجب"],["behavior","سلوك"],["daily","يومي"],["monthly","شهري"]].map(([key,label])=>({key,label}));
let session={},teacherUser={},teacher={},classes={},students={},grades={},formulas={},assignments=[],TEACHER_CODE="",selectedClassId="",selectedPeriod="term1",editingPeriod="";
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),norm=v=>String(v??"").trim().toLowerCase(),num=v=>v===""||v===null||v===undefined?null:(Number.isFinite(Number(v))?Number(v):null),safeJS=v=>String(v||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'"),safeId=v=>String(v||"").replace(/[^a-zA-Z0-9_-]/g,"_");
let toastTimer;function toast(text){$("toast").textContent=text;$("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2300);}
async function req(path,method="GET",data=undefined){const o={method,cache:"no-store"};if(data!==undefined){o.headers={"Content-Type":"application/json"};o.body=JSON.stringify(data)}const r=await fetch(`${DB}/${path}.json`,o);if(!r.ok)throw new Error(`${method}_${r.status}`);return method==="DELETE"?true:r.json()}const dbGet=p=>req(p),dbPatch=(p,d)=>req(p,"PATCH",d),dbPut=(p,d)=>req(p,"PUT",d);
function logout(){sessionStorage.removeItem("tahadi_session");sessionStorage.removeItem("tahadi_code");sessionStorage.removeItem("tahadi_role");localStorage.removeItem("tahadi_remembered_login");location.replace("index.html")}
function loadSession(){try{session=JSON.parse(sessionStorage.getItem("tahadi_session")||"{}")}catch{session={}}if(!session.code){location.replace("index.html");return false}return true}
function normalizeClassSubjects(c){let rows=Array.isArray(c?.subjects)?c.subjects:Object.values(c?.subjects||{});return rows.filter(Boolean).map((s,i)=>({id:String(s.id||`SUB_${i+1}`),name:String(s.name||s.subjectName||"").trim(),maxGrade:Number(s.maxGrade||100),passGrade:Number(s.passGrade??50),order:Number(s.order||i+1),autoType:s.autoType||""})).filter(s=>s.name).sort((a,b)=>a.order-b.order)}
function classSubject(classId,subjectId="",subjectName=""){const list=normalizeClassSubjects(classes[classId]);return list.find(s=>!s.autoType&&String(s.id)===String(subjectId))||list.find(s=>!s.autoType&&norm(s.name)===norm(subjectName))||null}
function rawClassIds(){const x=teacher.classIds;return Array.isArray(x)?x:(x&&typeof x==="object"?Object.keys(x):[])}
function resolveAssignments(){let rows=Array.isArray(teacher.assignments)?teacher.assignments:Object.values(teacher.assignments||{});rows=rows.filter(Boolean).map(a=>{const s=classSubject(a.classId,a.subjectId,a.subjectName||teacher.subject);return s&&classes[a.classId]?{classId:a.classId,subjectId:s.id,subjectName:s.name,maxGrade:s.maxGrade,passGrade:s.passGrade}:null}).filter(Boolean);if(rows.length)return rows;return rawClassIds().map(classId=>{const s=classSubject(classId,"",teacher.subject);return s?{classId,subjectId:s.id,subjectName:s.name,maxGrade:s.maxGrade,passGrade:s.passGrade}:null}).filter(Boolean)}
async function verifyTeacher(){if(!loadSession())return false;teacherUser=await dbGet(`users/${encodeURIComponent(session.code)}`);if(!teacherUser||!["teacher","th"].includes(norm(teacherUser.role))||teacherUser.active===false||teacherUser.hidden===true){logout();return false}TEACHER_CODE=teacherUser.teacherId||session.code;teacher=await dbGet(`teachers/${encodeURIComponent(TEACHER_CODE)}`);if(!teacher)throw new Error("TEACHER_NOT_FOUND");return true}
async function loadBaseData(){const[a,b]=await Promise.all([dbGet("classes"),dbGet("students")]);classes=a||{};students=b||{};assignments=resolveAssignments()}
function assignmentFor(classId){return assignments.find(a=>a.classId===classId)||null}function activeAssignment(){return assignmentFor(selectedClassId)}function subjectMax(){return Number(activeAssignment()?.maxGrade||100)}function subjectPass(){return Number(activeAssignment()?.passGrade??50)}
function studentsOfClass(classId){return Object.entries(students).map(([code,s])=>({code,...s})).filter(s=>s.classId===classId&&s.deleted!==true).sort((a,b)=>(Number(a.serial||999999)-Number(b.serial||999999))||String(a.name||"").localeCompare(String(b.name||""),"ar"))}
function renderTeacher(){const names=[...new Set(assignments.map(a=>a.subjectName))];$("teacherName").textContent=teacher.name||teacherUser.name||"—";$("teacherSubject").textContent=`المواد: ${names.join("، ")||teacher.subject||"—"}`}
function renderClasses(){if(!assignments.length){$("classesGrid").innerHTML=`<div class="empty">لا توجد مادة وصف مسندان إلى حسابك حالياً. يجب ربط الأستاذ من صفحة الإدارة بمادة موجودة داخل الصف.</div>`;return}$("classesGrid").innerHTML=assignments.map(a=>{const c=classes[a.classId]||{},count=studentsOfClass(a.classId).length;return`<button type="button" class="class-card ${selectedClassId===a.classId?"active":""}" onclick="selectClass('${safeJS(a.classId)}')"><div class="class-count">${count}</div><div class="class-icon">د</div><h4>${esc(c.name||a.classId)}</h4><p>${esc(a.subjectName)}<br>القاعة ${esc(c.roomNumber||"—")} | من ${a.maxGrade} | النجاح ${a.passGrade}</p></button>`}).join("")}
async function selectClass(classId){selectedClassId=classId;selectedPeriod="term1";$("searchInput").value="";$("gradesSection").classList.remove("hidden");renderClasses();await Promise.all([loadClassGrades(),loadFormulas()]);renderPeriodButtons();renderFormulaInfo();renderGradeTable();const a=activeAssignment(),c=classes[classId]||{};$("selectedClassTitle").textContent=`${c.name||"الصف"} - ${a?.subjectName||"المادة"}`;$("studentCount").textContent=`${studentsOfClass(classId).length} طالب`;setTimeout(()=>$("gradesSection").scrollIntoView({behavior:"smooth",block:"start"}),100)}
function gradePath(code){const a=activeAssignment();return`grades/${encodeURIComponent(code)}/${encodeURIComponent(a.subjectId)}`}async function loadClassGrades(){grades={};const list=studentsOfClass(selectedClassId),res=await Promise.all(list.map(s=>dbGet(gradePath(s.code))));list.forEach((s,i)=>grades[s.code]=res[i]||{})}
function formulaBasePath(){const a=activeAssignment();return`gradeSchemas/${encodeURIComponent(TEACHER_CODE)}/${encodeURIComponent(selectedClassId)}/${encodeURIComponent(a.subjectId)}`}async function loadFormulas(){formulas=await dbGet(formulaBasePath())||{}}
function activeComponents(period){const c=formulas?.[period]?.components||{};return COMPONENTS.filter(x=>num(c[x.key])!==null&&Number(c[x.key])>0).map(x=>({...x,max:Number(c[x.key])}))}
function formulaConfigured(period){const list=activeComponents(period);return list.length>0&&Math.abs(list.reduce((s,x)=>s+x.max,0)-subjectMax())<.001}
function renderPeriodButtons(){$("periodTools").innerHTML=Object.entries(PERIODS).map(([k,v])=>`<button type="button" class="period-btn ${formulaConfigured(k)?"configured":""} ${selectedPeriod===k?"selected":""}" onclick="selectPeriod('${k}')">${esc(v.label)}</button>`).join("")}
function selectPeriod(period){selectedPeriod=period;renderPeriodButtons();renderFormulaInfo();renderGradeTable()}
function renderFormulaInfo(){const list=activeComponents(selectedPeriod),a=activeAssignment(),txt=formulaConfigured(selectedPeriod)?`${list.map(x=>`${x.label} (${x.max})`).join(" + ")} = ${subjectMax()}`:`يمكن إدخال درجة ${PERIODS[selectedPeriod].label} مباشرة من ${subjectMax()}، أو إعداد تقسيم الدرجة إلى مفردات.`;$("formulaInfo").innerHTML=`<div><strong>${esc(a?.subjectName||"المادة")}:</strong> ${txt}</div><button class="setup" type="button" onclick="openFormulaModal('${selectedPeriod}')">${formulaConfigured(selectedPeriod)?"تعديل تقسيم الدرجة":"تقسيم الدرجة"}</button>`}
function filteredStudents(){const q=norm($("searchInput").value);return studentsOfClass(selectedClassId).filter(s=>!q||norm(`${s.name} ${s.code}`).includes(q))}
function componentValue(code,period,key){return grades[code]?.components?.[period]?.[key]??""}
function directValue(code,period){return grades[code]?.[period]??""}
function periodTotal(code,period){if(!formulaConfigured(period))return num(directValue(code,period));const comps=activeComponents(period);let total=0,seen=false;for(const c of comps){const v=num(componentValue(code,period,c.key));if(v!==null){total+=v;seen=true}}return seen?Math.round(total*100)/100:num(directValue(code,period))}
function renderGradeTable(){const list=filteredStudents(),components=activeComponents(selectedPeriod),configured=formulaConfigured(selectedPeriod),max=subjectMax(),pass=subjectPass();if(!list.length){$("tableArea").innerHTML=`<div class="empty">لا توجد أسماء مطابقة.</div>`;return}const cols=configured?components.map(c=>`<th class="score-col"><span class="column-title">${esc(c.label)}</span><span class="column-max">من ${c.max}</span></th>`).join(""):`<th class="score-col"><span class="column-title">${esc(PERIODS[selectedPeriod].label)}</span><span class="column-max">من ${max}</span></th>`;$("tableArea").innerHTML=`<div class="table-wrap"><table class="grade-table"><thead><tr><th class="seq-col">ت</th><th class="name-col">اسم الطالب</th>${cols}<th class="total-col"><span class="column-title">الدرجة</span><span class="column-max">النجاح ${pass}</span></th></tr></thead><tbody>${list.map((s,i)=>{const total=periodTotal(s.code,selectedPeriod),fail=total!==null&&total<pass,inputs=configured?components.map(c=>`<td class="score-col"><input class="score-input" type="number" inputmode="decimal" min="0" max="${c.max}" step="0.5" data-student="${esc(s.code)}" data-component="${esc(c.key)}" data-max="${c.max}" value="${esc(componentValue(s.code,selectedPeriod,c.key))}" oninput="scoreChanged(this)"></td>`).join(""):`<td class="score-col"><input class="score-input" type="number" inputmode="decimal" min="0" max="${max}" step="0.5" data-student="${esc(s.code)}" data-direct="1" data-max="${max}" value="${esc(directValue(s.code,selectedPeriod))}" oninput="scoreChanged(this)"></td>`;return`<tr><td class="seq-col">${esc(s.serial||i+1)}</td><td class="name-col"><div class="student-name">${esc(s.name||"—")}</div><div class="student-code">${esc(s.code)}</div></td>${inputs}<td id="total_${safeId(s.code)}" class="total-col ${fail?"fail":""}">${total===null?"—":total}</td></tr>`}).join("")}</tbody></table></div>`}
function ensureRecord(code){if(!grades[code])grades[code]={};return grades[code]}
function scoreChanged(input){const code=input.dataset.student,max=Number(input.dataset.max),v=num(input.value);input.classList.toggle("invalid",v!==null&&(v<0||v>max));if(input.classList.contains("invalid"))return;const r=ensureRecord(code);if(input.dataset.direct){if(v===null)delete r[selectedPeriod];else r[selectedPeriod]=v}else{r.components??={};r.components[selectedPeriod]??={};if(v===null)delete r.components[selectedPeriod][input.dataset.component];else r.components[selectedPeriod][input.dataset.component]=v;r[selectedPeriod]=periodTotal(code,selectedPeriod)}const total=periodTotal(code,selectedPeriod),cell=$(`total_${safeId(code)}`);if(cell){cell.textContent=total===null?"—":total;cell.classList.toggle("fail",total!==null&&total<subjectPass())}}
function openFormulaModal(period){editingPeriod=period;const values=formulas?.[period]?.components||{};$("formulaModalTitle").textContent=`تقسيم ${PERIODS[period].label}`;$("formulaModalDesc").textContent=`اختر مفردات التقييم. يجب أن يكون مجموعها ${subjectMax()} وهي الدرجة العظمى للمادة في هذا الصف.`;$("componentList").innerHTML=COMPONENTS.map(c=>{const v=num(values[c.key]),checked=v!==null&&v>0;return`<div class="component-item"><input type="checkbox" class="component-check" data-key="${esc(c.key)}" ${checked?"checked":""} onchange="componentToggle(this)"><div class="component-name">${esc(c.label)}</div><input type="number" class="max-input" data-max-key="${esc(c.key)}" min="0.5" max="${subjectMax()}" step="0.5" value="${checked?v:""}" ${checked?"":"disabled"} oninput="updateFormulaTotal()" placeholder="الدرجة"></div>`}).join("");updateFormulaTotal();$("formulaModal").classList.add("show")}
function componentToggle(ch){const i=document.querySelector(`[data-max-key="${CSS.escape(ch.dataset.key)}"]`);i.disabled=!ch.checked;if(!ch.checked)i.value="";else if(!i.value)i.value="1";updateFormulaTotal()}
function formulaFormData(){const out={};document.querySelectorAll(".component-check:checked").forEach(ch=>{const i=document.querySelector(`[data-max-key="${CSS.escape(ch.dataset.key)}"]`),v=num(i.value);if(v!==null&&v>0)out[ch.dataset.key]=v});return out}
function updateFormulaTotal(){const total=Object.values(formulaFormData()).reduce((s,v)=>s+Number(v),0),target=subjectMax(),el=$("formulaTotal");el.querySelector("strong").textContent=`${total} / ${target}`;el.className=`formula-total ${Math.abs(total-target)<.001?"valid":"invalid"}`}
$("saveFormulaBtn").onclick=async()=>{const components=formulaFormData(),total=Object.values(components).reduce((s,v)=>s+Number(v),0),target=subjectMax();if(!Object.keys(components).length){await dbPut(`${formulaBasePath()}/${editingPeriod}`,null);delete formulas[editingPeriod];$("formulaModal").classList.remove("show");renderPeriodButtons();renderFormulaInfo();renderGradeTable();toast("تم إلغاء تقسيم الدرجة وسيكون الإدخال مباشراً");return}if(Math.abs(total-target)>.001)return toast(`مجموع المفردات يجب أن يساوي ${target}`);const data={components,maxGrade:target,subjectId:activeAssignment().subjectId,subjectName:activeAssignment().subjectName,updatedAt:Date.now(),updatedBy:TEACHER_CODE};await dbPut(`${formulaBasePath()}/${editingPeriod}`,data);formulas[editingPeriod]=data;$("formulaModal").classList.remove("show");renderPeriodButtons();renderFormulaInfo();renderGradeTable();toast("تم اعتماد تقسيم الدرجة")}
$("closeFormulaModal").onclick=()=> $("formulaModal").classList.remove("show");$("formulaModal").addEventListener("click",e=>{if(e.target===$("formulaModal"))$("formulaModal").classList.remove("show")});
function validateScores(){for(const i of document.querySelectorAll(".score-input")){const v=num(i.value),m=Number(i.dataset.max);if(v!==null&&(v<0||v>m)){i.classList.add("invalid");i.scrollIntoView({behavior:"smooth",block:"center"});toast(`الدرجة يجب أن تكون بين 0 و ${m}`);return false}}return true}
$("saveGradesBtn").onclick=async()=>{if(!selectedClassId||!activeAssignment()||!validateScores())return;const btn=$("saveGradesBtn");btn.disabled=true;btn.textContent="جاري حفظ الدرجات...";try{const a=activeAssignment(),updates={},now=Date.now(),configured=formulaConfigured(selectedPeriod);for(const s of studentsOfClass(selectedClassId)){const r=grades[s.code]||{},base=`grades/${s.code}/${a.subjectId}`;updates[`${base}/subjectId`]=a.subjectId;updates[`${base}/subjectName`]=a.subjectName;updates[`${base}/maxGrade`]=a.maxGrade;updates[`${base}/passGrade`]=a.passGrade;updates[`${base}/teacherCode`]=TEACHER_CODE;updates[`${base}/classId`]=selectedClassId;updates[`${base}/updatedAt`]=now;updates[`${base}/updatedBy`]=TEACHER_CODE;updates[`${base}/${selectedPeriod}`]=periodTotal(s.code,selectedPeriod);if(configured)updates[`${base}/components/${selectedPeriod}`]=r.components?.[selectedPeriod]||null}await dbPatch("",updates);toast(`تم حفظ درجات ${PERIODS[selectedPeriod].label}`);await loadClassGrades();renderGradeTable()}catch(e){console.error(e);toast("تعذر حفظ الدرجات")}finally{btn.disabled=false;btn.textContent="حفظ درجات الصف"}}
$("searchInput").addEventListener("input",renderGradeTable);$("reloadBtn").onclick=async()=>{if(!selectedClassId)return;try{$("reloadBtn").disabled=true;await Promise.all([loadClassGrades(),loadFormulas()]);renderPeriodButtons();renderFormulaInfo();renderGradeTable();toast("تم تحديث البيانات")}catch(e){console.error(e);toast("تعذر تحديث البيانات")}finally{$("reloadBtn").disabled=false}};$("logoutBtn").onclick=logout;
async function init(){try{if(!await verifyTeacher())return;await loadBaseData();renderTeacher();renderClasses()}catch(e){console.error(e);toast("تعذر تحميل حساب الأستاذ")}finally{$("loaderScreen").classList.add("hidden")}}window.addEventListener("load",init);
</script></body></html>
