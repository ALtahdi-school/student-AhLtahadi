<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#075fcf">
<title>الكرتات | مدرسة التحدي الأهلية المختلطة</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--p:#075fcf;--ps:#edf5ff;--pink:#d84f94;--pinks:#fff0f7;--g:#078b50;--r:#d92d20;--bg:#f5f8fc;--text:#172033;--muted:#667085;--border:#e3e9f1}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.loading{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#fff}.loader{width:44px;height:44px;border:4px solid #e7edf5;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border)}.header-in{width:min(1450px,100%);min-height:68px;margin:auto;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:9px}.brand{display:flex;align-items:center;gap:9px}.brand img{width:47px;height:47px;object-fit:contain}.brand h1{font-size:14px;font-weight:900}.brand p{margin-top:3px;color:var(--p);font-size:8px;font-weight:900}.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{min-height:39px;padding:0 12px;border:0;border-radius:10px;font-size:9px;font-weight:900}.btn-p{color:#fff;background:var(--p)}.btn-soft{color:var(--p);background:var(--ps)}.btn-g{color:#fff;background:var(--g)}.btn-r{color:#fff;background:var(--r)}
.main{width:min(1450px,100%);margin:auto;padding:14px}.hero{padding:18px;border-radius:18px;background:linear-gradient(135deg,#0870e8,#064594);color:#fff}.hero h2{font-size:19px}.hero p{margin-top:6px;font-size:9px;line-height:1.8}
.panel{margin-top:13px;border:1px solid var(--border);border-radius:16px;background:#fff;overflow:hidden}.panel-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}.panel-head h3{font-size:13px}.panel-body{padding:13px}
.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px}.toolbar input,.toolbar select{height:42px;padding:0 10px;border:1px solid var(--border);border-radius:9px;outline:none}
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:10px}.class-card{padding:11px;border:1px solid var(--border);border-radius:12px;background:#fff;text-align:right}.class-card.male{background:var(--ps);border-color:#a8cef8}.class-card.female{background:var(--pinks);border-color:#eaa1c7}.class-card.active{box-shadow:0 0 0 3px rgba(7,95,207,.10)}.class-card h4{font-size:11px}.class-card p{margin-top:4px;color:var(--muted);font-size:7px}
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px}.student-option{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--border);border-radius:11px;background:#fff}.student-option input{width:18px;height:18px}.student-photo{width:40px;height:40px;overflow:hidden;border-radius:10px;background:#edf5ff;display:flex;align-items:center;justify-content:center;color:var(--p);font-weight:900}.student-photo img{width:100%;height:100%;object-fit:cover}.student-option strong{font-size:9px}.student-option span{display:block;margin-top:3px;color:var(--muted);font-size:7px}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.card{position:relative;width:100%;aspect-ratio:1.586/1;overflow:hidden;border:1px solid #cfd7e4;border-radius:18px;background:#fff;box-shadow:0 10px 25px rgba(18,38,63,.08)}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#f9fcff 0 62%,#eaf4ff 62%)}.card.female:before{background:linear-gradient(135deg,#fffafd 0 62%,#fff0f7 62%)}
.card-inner{position:relative;z-index:2;height:100%;padding:14px;display:grid;grid-template-columns:72px 1fr 74px;gap:10px;align-items:center}.card-logo{position:absolute;top:10px;right:12px;width:38px;height:38px;object-fit:contain}.photo{width:68px;height:82px;border-radius:12px;overflow:hidden;background:#eef4fb;border:1px solid #cad9eb;display:flex;align-items:center;justify-content:center;color:#607089;font-size:22px;font-weight:900}.photo img{width:100%;height:100%;object-fit:cover}.card-info{padding-top:25px}.card-info h3{font-size:13px;font-weight:900;line-height:1.55}.card-info p{margin-top:4px;color:#475467;font-size:8px;font-weight:800}.card-code{margin-top:6px;color:var(--p)!important;direction:ltr;text-align:right}.qr{width:68px;height:68px;padding:4px;background:#fff;border-radius:9px}.qr canvas,.qr img{width:60px!important;height:60px!important}.card-year{position:absolute;bottom:9px;left:12px;color:#667085;font-size:7px;font-weight:900}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:9px}
.toast{position:fixed;z-index:8000;left:50%;top:80px;transform:translate(-50%,-10px);opacity:0;visibility:hidden;width:min(500px,calc(100% - 20px));padding:11px;border-radius:12px;background:#172033;color:#fff;text-align:center;font-size:9px;font-weight:900;transition:.2s}.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.pdf-host{position:fixed;left:-12000px;top:0;width:794px}.sheet{width:794px;height:1123px;padding:34px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:240px;gap:18px 16px;background:#fff}
.sheet .card{border-radius:11px;box-shadow:none}
@media(max-width:720px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .btn{width:100%}.preview-grid{grid-template-columns:1fr}.header-in{align-items:flex-start}.brand h1{font-size:11px}}
</style>
</head>
<body>
<div id="loading" class="loading"><div class="loader"></div></div>
<header class="header"><div class="header-in"><div class="brand"><img src="logo.png" alt=""><div><h1>مدرسة التحدي الأهلية المختلطة</h1><p>قسم الحوكمة - الكرتات</p></div></div><div class="actions"><button class="btn btn-soft" onclick="location.href='add.html'">الرجوع للإدارة</button><button class="btn btn-r" onclick="logout()">خروج</button></div></div></header>
<main class="main">
<section class="hero"><h2>إنشاء كرتات الطلبة</h2><p>اختر الصف والطلبة، ثم عاين الكرتات وحمّلها PDF. الصفحة مرتبطة مباشرة ببيانات الإدارة وتستخدم صورة الطالب وكوده وصفه.</p></section>
<section class="panel"><div class="panel-head"><h3>اختيار الطلبة</h3><button class="btn btn-soft" onclick="loadData()">تحديث</button></div><div class="panel-body">
<div class="toolbar"><select id="classSelect"><option value="">كل الصفوف</option></select><select id="genderSelect"><option value="">الجنس: الكل</option><option value="male">بنين</option><option value="female">بنات</option></select><input id="search" placeholder="بحث بالاسم أو الكود"><button class="btn btn-p" onclick="selectVisible()">تحديد الظاهر</button></div>
<div id="classGrid" class="class-grid"></div><div id="students" class="students"></div>
<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:11px"><button class="btn btn-soft" onclick="clearSelection()">إلغاء التحديد</button><button class="btn btn-g" onclick="renderPreview()">معاينة الكرتات</button><button id="pdfBtn" class="btn btn-p" onclick="downloadPDF()">تحميل PDF</button></div>
</div></section>
<section class="panel"><div class="panel-head"><h3>المعاينة</h3><span id="countText" style="font-size:8px;color:#667085">0 كرت</span></div><div class="panel-body"><div id="preview" class="preview-grid"><div class="empty">حدد الطلبة ثم اضغط معاينة.</div></div></div></section>
</main>
<div id="pdfHost" class="pdf-host"></div><div id="toast" class="toast"></div>
<script>
const DB="https://tahadi-school-default-rtdb.europe-west1.firebasedatabase.app",YEAR="2026-2027";
const $=id=>document.getElementById(id),norm=v=>String(v||"").trim().toLowerCase(),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let STUDENTS={},CLASSES={},SELECTED=new Set(),timer=0;
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(timer);timer=setTimeout(()=>$("toast").classList.remove("show"),2600)}
async function req(path,method="GET",data){const o={method,cache:"no-store"};if(data!==undefined){o.headers={"Content-Type":"application/json"};o.body=JSON.stringify(data)}const r=await fetch(`${DB}/${path}.json`,o);if(!r.ok)throw new Error(`${method}_${r.status}`);return r.json()}
const dbGet=p=>req(p);
function session(){try{return JSON.parse(sessionStorage.getItem("tahadi_session")||"{}")}catch{return{}}}
function logout(){sessionStorage.clear();localStorage.removeItem("tahadi_remembered_login");location.replace("index.html")}
function cameFromAdmin(){try{const r=new URL(document.referrer);return r.host===location.host&&/\/add\.html$/i.test(r.pathname)}catch{return false}}
function gateOk(code){try{const x=JSON.parse(sessionStorage.getItem("tahadi_cards_gate")||"{}");return x.code===code&&Date.now()-Number(x.at||0)<8*3600000}catch{return false}}
async function verifyAdmin(){const s=session();if(!s.code)return logout(),false;const u=await dbGet(`users/${encodeURIComponent(s.code)}`);if(!u||!["admin","administrator","add"].includes(norm(u.role))||u.active===false)return logout(),false;if(!gateOk(s.code)){if(!cameFromAdmin()){location.replace("add.html");return false}sessionStorage.setItem("tahadi_cards_gate",JSON.stringify({code:s.code,at:Date.now()}))}return true}
function gender(v){const g=norm(v);return["female","f","girl","girls","اناث","إناث","بنات"].includes(g)?"female":"male"}
function room(v){const n=Number(v);if(n===101)return"الطلاب الجدد";if(n===102)return"الطلاب المنقولين";return n?`القاعة ${n}`:"بدون قاعة"}
function visible(){const cid=$("classSelect").value,g=$("genderSelect").value,q=norm($("search").value);return Object.entries(STUDENTS).map(([code,s])=>({code,...s})).filter(s=>s.hidden!==true&&(!cid||s.classId===cid)&&(!g||gender(s.gender)===g)&&(!q||norm(`${s.name} ${s.code}`).includes(q))).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ar"))}
function renderClasses(){$("classGrid").innerHTML=Object.entries(CLASSES).map(([id,c])=>{const n=Object.values(STUDENTS).filter(s=>s?.classId===id&&s.hidden!==true).length,g=gender(c.gender);return`<button class="class-card ${g} ${$("classSelect").value===id?"active":""}" onclick="chooseClass('${esc(id)}')"><h4>${esc(c.name||id)}</h4><p>${n} طالب — ${esc(room(c.roomNumber))}</p></button>`}).join("")}
function chooseClass(id){$("classSelect").value=id;renderClasses();renderStudents()}
function renderStudents(){const rows=visible();$("students").innerHTML=rows.length?rows.map(s=>{const img=s.profileImage||"",c=CLASSES[s.classId]||{};return`<label class="student-option"><input type="checkbox" value="${esc(s.code)}" ${SELECTED.has(s.code)?"checked":""} onchange="toggleStudent(this)"><div class="student-photo">${img?`<img src="${esc(img)}" alt="">`:esc(String(s.name||"ط").charAt(0))}</div><div><strong>${esc(s.name||"—")}</strong><span>${esc(c.name||"")} — ${esc(s.code)}</span></div></label>`}).join(""):`<div class="empty">لا توجد أسماء مطابقة.</div>`}
function toggleStudent(ch){ch.checked?SELECTED.add(ch.value):SELECTED.delete(ch.value)}
function selectVisible(){visible().forEach(s=>SELECTED.add(s.code));renderStudents();toast(`تم تحديد ${SELECTED.size} طالب`)}
function clearSelection(){SELECTED.clear();renderStudents();renderPreview()}
function cardHTML(s,idSuffix=""){const c=CLASSES[s.classId]||{},g=gender(s.gender),img=s.profileImage||"",qrid=`qr_${String(s.code).replace(/[^a-zA-Z0-9_-]/g,"_")}_${idSuffix}`;return`<div class="card ${g}"><img class="card-logo" src="logo.png" alt=""><div class="card-inner"><div class="photo">${img?`<img src="${esc(img)}" alt="">`:esc(String(s.name||"ط").charAt(0))}</div><div class="card-info"><h3>${esc(s.name||"—")}</h3><p>${esc(c.name||s.className||"—")} — ${esc(room(s.roomNumber))}</p><p class="card-code">${esc(s.code)}</p></div><div id="${qrid}" class="qr" data-code="${esc(s.code)}"></div></div><div class="card-year">${YEAR}</div></div>`}
function fillQR(root){root.querySelectorAll(".qr").forEach(el=>{el.innerHTML="";new QRCode(el,{text:el.dataset.code,width:60,height:60,correctLevel:QRCode.CorrectLevel.M})})}
function selectedRows(){return[...SELECTED].map(code=>({code,...(STUDENTS[code]||{})})).filter(s=>s.name)}
function renderPreview(){const rows=selectedRows();$("countText").textContent=`${rows.length} كرت`;$("preview").innerHTML=rows.length?rows.map((s,i)=>cardHTML(s,`p${i}`)).join(""):`<div class="empty">حدد الطلبة ثم اضغط معاينة.</div>`;fillQR($("preview"))}
async function waitImages(root){await Promise.all([...root.querySelectorAll("img")].map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=r;img.onerror=r})))}
async function downloadPDF(){const rows=selectedRows();if(!rows.length)return toast("حدد طالباً واحداً على الأقل");const btn=$("pdfBtn");btn.disabled=true;btn.textContent="جاري تجهيز PDF...";try{const pages=[];for(let i=0;i<rows.length;i+=8)pages.push(rows.slice(i,i+8));$("pdfHost").innerHTML=pages.map((pg,pi)=>`<section class="sheet">${pg.map((s,i)=>cardHTML(s,`pdf${pi}_${i}`)).join("")}</section>`).join("");fillQR($("pdfHost"));await waitImages($("pdfHost"));const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4",compress:true}),els=[...document.querySelectorAll("#pdfHost .sheet")];for(let i=0;i<els.length;i++){if(i)pdf.addPage("a4","portrait");const canvas=await html2canvas(els[i],{scale:2,useCORS:true,allowTaint:true,backgroundColor:"#fff",width:794,height:1123,windowWidth:794,windowHeight:1123});pdf.addImage(canvas.toDataURL("image/jpeg",.96),"JPEG",0,0,210,297,undefined,"FAST");canvas.width=1;canvas.height=1}pdf.save(`كرتات_الطلاب_${YEAR}.pdf`);toast("تم تحميل ملف الكرتات")}catch(e){console.error(e);toast("تعذر إنشاء ملف الكرتات")}finally{btn.disabled=false;btn.textContent="تحميل PDF";$("pdfHost").innerHTML=""}}
async function loadData(){try{$("loading").classList.remove("hidden");const[s,c]=await Promise.all([dbGet("students"),dbGet("classes")]);STUDENTS=s||{};CLASSES=c||{};$("classSelect").innerHTML='<option value="">كل الصفوف</option>'+Object.entries(CLASSES).map(([id,x])=>`<option value="${esc(id)}">${esc(x.name||id)}</option>`).join("");renderClasses();renderStudents()}catch(e){console.error(e);toast("تعذر تحميل البيانات")}finally{$("loading").classList.add("hidden")}}
$("classSelect").onchange=()=>{renderClasses();renderStudents()};$("genderSelect").onchange=renderStudents;$("search").oninput=renderStudents;
window.addEventListener("load",async()=>{if(await verifyAdmin())await loadData()});
</script>
</body></html>
