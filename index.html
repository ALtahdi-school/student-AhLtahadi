<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#0757c8">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>قسم الحوكمة | مدرسة التحدي الأهلية المختلطة</title>


    <style>

        /* =====================================================
           إعدادات عامة
        ===================================================== */

        :root {

            --primary: #075fcf;
            --primary-dark: #034da9;
            --primary-light: #eaf3ff;

            --background: #f5f8fc;

            --white: #ffffff;

            --text: #172033;
            --text-soft: #667085;

            --border: #e2e8f0;

            --danger: #c62828;
            --danger-bg: #fff1f1;

            --success: #078746;
            --success-bg: #ecfdf3;

            --shadow:
                0 20px 55px
                rgba(18, 43, 77, 0.12);

        }


        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            -webkit-tap-highlight-color:
                transparent;

        }


        html,
        body {

            width: 100%;
            min-height: 100%;

        }


        body {

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                var(--background);

            color:
                var(--text);

            overflow-x: hidden;

        }


        button,
        input {

            font-family: inherit;

        }



        /* =====================================================
           خلفية الصفحة
        ===================================================== */

        .login-page {

            display: none;

            position: relative;

            width: 100%;

            min-height: 100vh;
            min-height: 100dvh;

            align-items: center;
            justify-content: center;

            padding:
                32px 18px;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 90% 5%,
                    rgba(7, 95, 207, .15),
                    transparent 34%
                ),

                radial-gradient(
                    circle at 5% 95%,
                    rgba(7, 95, 207, .08),
                    transparent 32%
                ),

                linear-gradient(
                    180deg,
                    #f7faff,
                    #f3f6fb
                );

        }


        .login-page.show {

            display: flex;

            animation:
                pageFade
                .65s
                ease
                both;

        }



        /* =====================================================
           أشكال الخلفية
        ===================================================== */

        .shape {

            position: absolute;

            border-radius: 50%;

            pointer-events: none;

            filter:
                blur(2px);

        }


        .shape-one {

            width: 210px;
            height: 210px;

            top: -90px;
            right: -85px;

            background:
                rgba(7, 95, 207, .07);

        }


        .shape-two {

            width: 170px;
            height: 170px;

            bottom: -75px;
            left: -65px;

            background:
                rgba(7, 95, 207, .06);

        }



        /* =====================================================
           الحاوية
        ===================================================== */

        .login-container {

            position: relative;

            z-index: 2;

            width: 100%;
            max-width: 420px;

        }



        /* =====================================================
           الشعار
        ===================================================== */

        .logo-area {

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 18px;

        }


        .logo-box {

            position: relative;

            width: 120px;
            height: 120px;

            display: flex;

            align-items: center;
            justify-content: center;

        }


        .logo-circle {

            position: absolute;

            width: 108px;
            height: 108px;

            border-radius: 50%;

            background:
                rgba(7, 95, 207, .08);

            animation:
                pulseLogo
                2.3s
                ease-in-out
                infinite;

        }


        .login-logo {

            position: relative;

            z-index: 2;

            width: 105px;
            height: 105px;

            object-fit: contain;

            animation:
                logoIn
                .85s
                cubic-bezier(.16,1,.3,1)
                both;

            filter:
                drop-shadow(
                    0 12px 20px
                    rgba(7, 95, 207, .15)
                );

        }



        /* =====================================================
           عنوان المدرسة
        ===================================================== */

        .school-info {

            text-align: center;

            margin-bottom: 27px;

            animation:
                titleIn
                .75s
                .12s
                ease
                both;

        }


        .school-info h1 {

            font-size: 21px;

            font-weight: 800;

            line-height: 1.65;

            color:
                var(--text);

        }


        .school-info p {

            margin-top: 5px;

            font-size: 15px;

            font-weight: 700;

            color:
                var(--primary);

        }



        /* =====================================================
           بطاقة تسجيل الدخول
        ===================================================== */

        .login-card {

            width: 100%;

            padding:
                26px 20px
                22px;

            background:
                rgba(255,255,255,.96);

            border:
                1px solid
                rgba(255,255,255,.85);

            border-radius: 25px;

            box-shadow:
                var(--shadow);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            animation:
                cardIn
                .8s
                .16s
                cubic-bezier(.16,1,.3,1)
                both;

        }



        /* =====================================================
           عنوان البطاقة
        ===================================================== */

        .card-header {

            text-align: center;

            margin-bottom: 21px;

        }


        .card-header h2 {

            font-size: 20px;

            font-weight: 800;

            color:
                var(--text);

        }


        .card-header p {

            margin-top: 8px;

            font-size: 14px;

            color:
                var(--text-soft);

        }



        /* =====================================================
           حقل الكود
        ===================================================== */

        .input-wrapper {

            position: relative;

            width: 100%;

        }


        .code-input {

            width: 100%;

            height: 60px;

            padding:
                0 18px;

            border:
                1.5px solid
                var(--border);

            border-radius: 17px;

            outline: none;

            background:
                #ffffff;

            color:
                var(--text);

            font-size: 18px;

            font-weight: 800;

            text-align: center;

            direction: ltr;

            letter-spacing: 1.3px;

            text-transform: uppercase;

            transition:
                border-color .25s ease,
                box-shadow .25s ease,
                transform .25s ease;

        }


        .code-input::placeholder {

            direction: rtl;

            font-size: 15px;

            font-weight: 500;

            letter-spacing: 0;

            color:
                #98a2b3;

        }


        .code-input:focus {

            border-color:
                var(--primary);

            box-shadow:
                0 0 0 4px
                rgba(7, 95, 207, .08);

            transform:
                translateY(-1px);

        }



        /* =====================================================
           رسالة الخطأ والنجاح
        ===================================================== */

        .message {

            display: none;

            width: 100%;

            margin-bottom: 14px;

            padding:
                11px 13px;

            border-radius: 13px;

            text-align: center;

            font-size: 13px;

            line-height: 1.7;

            font-weight: 700;

        }


        .message.show {

            display: block;

            animation:
                messageIn
                .25s
                ease
                both;

        }


        .message.error {

            color:
                var(--danger);

            background:
                var(--danger-bg);

            border:
                1px solid
                #ffd5d5;

        }


        .message.success {

            color:
                var(--success);

            background:
                var(--success-bg);

            border:
                1px solid
                #b7ebcb;

        }



        /* =====================================================
           زر الدخول
        ===================================================== */

        .login-btn {

            width: 100%;

            height: 58px;

            margin-top: 15px;

            border: none;

            border-radius: 17px;

            outline: none;

            background:

                linear-gradient(
                    135deg,
                    #0868df,
                    #0757c8
                );

            color:
                #ffffff;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:

                0 13px 28px
                rgba(7, 95, 207, .24);

            transition:
                transform .2s ease,
                opacity .2s ease,
                box-shadow .2s ease;

        }


        .login-btn:active {

            transform:
                scale(.985);

            box-shadow:

                0 8px 18px
                rgba(7, 95, 207, .18);

        }


        .login-btn:disabled {

            opacity: .75;

            cursor: default;

        }



        /* =====================================================
           Loader
        ===================================================== */

        .spinner {

            display: none;

            width: 18px;
            height: 18px;

            margin-right: 9px;

            vertical-align: middle;

            border-radius: 50%;

            border:
                2px solid
                rgba(255,255,255,.35);

            border-top-color:
                #ffffff;

            animation:
                spin
                .7s
                linear
                infinite;

        }



        /* =====================================================
           Footer
        ===================================================== */

        .footer {

            padding-top: 21px;

            text-align: center;

            font-size: 12px;

            color:
                #98a2b3;

        }



        /* =====================================================
           Splash Screen
        ===================================================== */

        .splash {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 9999;

            align-items: center;
            justify-content: center;

            padding: 25px;

            background:

                radial-gradient(
                    circle at 50% 25%,
                    #197bf0 0%,
                    #0864d8 33%,
                    #064ba9 70%,
                    #033b89 100%
                );

            overflow: hidden;

            transition:
                opacity .65s ease,
                visibility .65s ease;

        }


        .splash.show {

            display: flex;

        }


        .splash.close {

            opacity: 0;

            visibility: hidden;

        }


        .splash::before {

            content: "";

            position: absolute;

            width: 380px;
            height: 380px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.035);

            top: -150px;
            right: -130px;

        }


        .splash::after {

            content: "";

            position: absolute;

            width: 290px;
            height: 290px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.025);

            bottom: -120px;
            left: -100px;

        }


        .splash-content {

            position: relative;

            z-index: 2;

            width: 100%;
            max-width: 430px;

            text-align: center;

            color: #ffffff;

        }


        .splash-logo-wrapper {

            position: relative;

            width: 150px;
            height: 150px;

            margin:
                0 auto;

            display: flex;

            align-items: center;
            justify-content: center;

        }


        .splash-glow {

            position: absolute;

            width: 145px;
            height: 145px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.12);

            animation:
                splashPulse
                2s
                ease-in-out
                infinite;

        }


        .splash-logo {

            position: relative;

            z-index: 2;

            width: 128px;
            height: 128px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 15px 28px
                    rgba(0,0,0,.16)
                );

            animation:
                splashLogoIn
                1s
                cubic-bezier(.16,1,.3,1)
                both;

        }


        .splash h1 {

            margin-top: 24px;

            font-size: 22px;

            line-height: 1.7;

            font-weight: 800;

            animation:
                splashTextIn
                .8s
                .25s
                ease
                both;

        }


        .splash-line {

            width: 0;
            height: 3px;

            margin:
                14px auto;

            border-radius: 10px;

            background:
                rgba(255,255,255,.88);

            animation:
                lineOpen
                .8s
                .5s
                ease
                forwards;

        }


        .splash p {

            font-size: 15px;

            font-weight: 700;

            opacity: .95;

            animation:
                splashTextIn
                .8s
                .55s
                ease
                both;

        }



        /* =====================================================
           عدم وجود الإنترنت
        ===================================================== */

        .offline-screen {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 20000;

            align-items: center;
            justify-content: center;

            padding: 24px;

            background:

                radial-gradient(
                    circle at top,
                    #edf5ff,
                    transparent 45%
                ),

                #ffffff;

        }


        .offline-screen.show {

            display: flex;

            animation:
                pageFade
                .35s
                ease;

        }


        .offline-box {

            width: 100%;

            max-width: 380px;

            text-align: center;

        }


        .offline-image {

            width: 220px;

            max-width: 75%;

            height: auto;

            object-fit: contain;

            margin-bottom: 24px;

            animation:
                offlineIn
                .7s
                cubic-bezier(.16,1,.3,1);

        }


        .offline-box h2 {

            font-size: 21px;

            font-weight: 800;

            color:
                var(--text);

        }


        .offline-box p {

            margin-top: 8px;

            font-size: 14px;

            line-height: 1.8;

            color:
                var(--text-soft);

        }


        .network-spinner {

            width: 27px;
            height: 27px;

            margin:
                24px auto
                0;

            border-radius: 50%;

            border:
                3px solid
                #e5eaf0;

            border-top-color:
                var(--primary);

            animation:
                spin
                .85s
                linear
                infinite;

        }


        .waiting-text {

            margin-top: 10px !important;

            font-size: 12px !important;

            color:
                #98a2b3 !important;

        }



        /* =====================================================
           Animation
        ===================================================== */

        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        @keyframes pageFade {

            from {

                opacity: 0;

            }

            to {

                opacity: 1;

            }

        }


        @keyframes logoIn {

            from {

                opacity: 0;

                transform:
                    translateY(-15px)
                    scale(.82);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        @keyframes titleIn {

            from {

                opacity: 0;

                transform:
                    translateY(13px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes cardIn {

            from {

                opacity: 0;

                transform:
                    translateY(28px)
                    scale(.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        @keyframes messageIn {

            from {

                opacity: 0;

                transform:
                    translateY(-5px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes pulseLogo {

            0%,
            100% {

                transform:
                    scale(.96);

                opacity: .65;

            }

            50% {

                transform:
                    scale(1.08);

                opacity: .95;

            }

        }


        @keyframes splashPulse {

            0%,
            100% {

                transform:
                    scale(.92);

                opacity: .6;

            }

            50% {

                transform:
                    scale(1.12);

                opacity: 1;

            }

        }


        @keyframes splashLogoIn {

            0% {

                opacity: 0;

                transform:
                    scale(.45)
                    translateY(25px);

            }

            65% {

                transform:
                    scale(1.07);

            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

            }

        }


        @keyframes splashTextIn {

            from {

                opacity: 0;

                transform:
                    translateY(14px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes lineOpen {

            from {

                width: 0;

            }

            to {

                width: 48px;

            }

        }


        @keyframes offlineIn {

            from {

                opacity: 0;

                transform:
                    translateY(-12px)
                    scale(.9);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }



        /* =====================================================
           الأجهزة الصغيرة
        ===================================================== */

        @media
        (max-width: 370px) {

            .login-page {

                padding:
                    23px 14px;

            }


            .login-logo {

                width: 91px;
                height: 91px;

            }


            .logo-box {

                width: 105px;
                height: 105px;

            }


            .logo-circle {

                width: 95px;
                height: 95px;

            }


            .school-info h1 {

                font-size: 19px;

            }


            .login-card {

                padding:
                    22px 16px;

                border-radius: 22px;

            }


            .splash h1 {

                font-size: 19px;

            }


            .splash-logo {

                width: 110px;
                height: 110px;

            }

        }


    </style>

</head>


<body>


<!-- =========================================================
     شاشة عدم وجود الإنترنت
========================================================= -->

<div
    id="offlineScreen"
    class="offline-screen"
>

    <div class="offline-box">

        <img
            src="images/no-internet.png"
            alt="لا يوجد اتصال بالإنترنت"
            class="offline-image"
        >

        <h2>
            لا يوجد اتصال بالإنترنت
        </h2>

        <p>
            يرجى التحقق من اتصالك بالإنترنت
        </p>

        <div class="network-spinner"></div>

        <p class="waiting-text">
            سيتم الدخول تلقائياً عند عودة الاتصال
        </p>

    </div>

</div>



<!-- =========================================================
     شاشة البداية
========================================================= -->

<div
    id="splashScreen"
    class="splash"
>

    <div class="splash-content">

        <div class="splash-logo-wrapper">

            <div class="splash-glow"></div>

            <img
                src="images/logo.png"
                alt="شعار مدرسة التحدي"
                class="splash-logo"
            >

        </div>


        <h1>
            مدرسة التحدي الأهلية المختلطة
        </h1>


        <div class="splash-line"></div>


        <p>
            قسم الحوكمة
        </p>

    </div>

</div>



<!-- =========================================================
     تسجيل الدخول
========================================================= -->

<main
    id="loginPage"
    class="login-page"
>

    <div class="shape shape-one"></div>

    <div class="shape shape-two"></div>


    <div class="login-container">


        <!-- الشعار -->

        <div class="logo-area">

            <div class="logo-box">

                <div class="logo-circle"></div>

                <img
                    src="images/logo.png"
                    alt="شعار مدرسة التحدي"
                    class="login-logo"
                >

            </div>

        </div>



        <!-- اسم المدرسة -->

        <div class="school-info">

            <h1>
                مدرسة التحدي الأهلية المختلطة
            </h1>

            <p>
                قسم الحوكمة
            </p>

        </div>



        <!-- البطاقة -->

        <div class="login-card">


            <div class="card-header">

                <h2>
                    تسجيل الدخول
                </h2>

                <p>
                    أدخل الكود الخاص بك
                </p>

            </div>



            <div
                id="messageBox"
                class="message"
            ></div>



            <div class="input-wrapper">

                <input
                    type="text"
                    id="userCode"
                    class="code-input"
                    placeholder="أدخل الكود الخاص بك"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    maxlength="25"
                >

            </div>



            <button
                type="button"
                id="loginButton"
                class="login-btn"
            >

                <span id="loginButtonText">
                    تسجيل الدخول
                </span>

                <span
                    id="loginSpinner"
                    class="spinner"
                ></span>

            </button>


        </div>



        <div class="footer">

            نظام الحوكمة الإلكتروني

        </div>


    </div>

</main>



<!-- =========================================================
     صوت بداية التطبيق
========================================================= -->

<audio
    id="startupSound"
    preload="auto"
>

    <source
        src="sounds/start.mp3"
        type="audio/mpeg"
    >

</audio>



<script>


/* =========================================================
   Firebase
========================================================= */

const DATABASE_URL =
    "https://tahadi-school-default-rtdb.europe-west1.firebasedatabase.app";


const USERS_PATH =
    "users";



/* =========================================================
   عناصر الصفحة
========================================================= */

const offlineScreen =
    document.getElementById("offlineScreen");


const splashScreen =
    document.getElementById("splashScreen");


const loginPage =
    document.getElementById("loginPage");


const userCodeInput =
    document.getElementById("userCode");


const loginButton =
    document.getElementById("loginButton");


const loginButtonText =
    document.getElementById("loginButtonText");


const loginSpinner =
    document.getElementById("loginSpinner");


const messageBox =
    document.getElementById("messageBox");


const startupSound =
    document.getElementById("startupSound");



/* =========================================================
   متغيرات
========================================================= */

let splashPlayed = false;

let loginRunning = false;



/* =========================================================
   تنظيف الكود
========================================================= */

function cleanCode(value) {

    return String(value || "")

        .trim()

        .replace(/\s+/g, "")

        .toUpperCase();

}



/* =========================================================
   الرسائل
========================================================= */

function showMessage(
    text,
    type = "error"
) {

    messageBox.textContent =
        text;


    messageBox.className =
        "message show " + type;

}



function hideMessage() {

    messageBox.textContent =
        "";


    messageBox.className =
        "message";

}



/* =========================================================
   حالة زر الدخول
========================================================= */

function setLoginLoading(status) {


    loginRunning =
        status;


    if (status) {


        loginButton.disabled =
            true;


        loginButtonText.textContent =
            "جاري التحقق";


        loginSpinner.style.display =
            "inline-block";


    }

    else {


        loginButton.disabled =
            false;


        loginButtonText.textContent =
            "تسجيل الدخول";


        loginSpinner.style.display =
            "none";


    }

}



/* =========================================================
   شاشة عدم وجود الإنترنت
========================================================= */

function showOfflineScreen() {


    offlineScreen.classList.add(
        "show"
    );


    loginPage.classList.remove(
        "show"
    );


    splashScreen.classList.remove(
        "show"
    );


    splashScreen.classList.remove(
        "close"
    );

}



function hideOfflineScreen() {


    offlineScreen.classList.remove(
        "show"
    );

}



/* =========================================================
   تشغيل صوت البداية
========================================================= */

function playStartupSound() {


    if (!startupSound) {

        return;

    }


    try {


        startupSound.currentTime =
            0;


        startupSound.volume =
            0.45;


        const request =
            startupSound.play();


        if (
            request &&
            typeof request.catch === "function"
        ) {


            request.catch(() => {

                /*
                    بعض الأجهزة والمتصفحات
                    تمنع الصوت التلقائي.
                */

            });


        }


    }

    catch (error) {


        console.log(
            "تعذر تشغيل صوت البداية"
        );


    }

}



/* =========================================================
   إظهار صفحة الدخول
========================================================= */

function showLoginPage() {


    hideOfflineScreen();


    splashScreen.classList.remove(
        "show"
    );


    splashScreen.classList.remove(
        "close"
    );


    loginPage.classList.add(
        "show"
    );


    setTimeout(() => {


        userCodeInput.focus();


    }, 300);

}



/* =========================================================
   الأنيميشن الافتتاحي
========================================================= */

function playSplash() {


    if (!navigator.onLine) {


        showOfflineScreen();

        return;


    }


    hideOfflineScreen();


    if (splashPlayed) {


        showLoginPage();

        return;


    }


    splashPlayed =
        true;


    loginPage.classList.remove(
        "show"
    );


    splashScreen.classList.add(
        "show"
    );


    playStartupSound();


    setTimeout(() => {


        splashScreen.classList.add(
            "close"
        );


        setTimeout(() => {


            showLoginPage();


        }, 650);


    }, 2400);

}



/* =========================================================
   قراءة بيانات المستخدم
========================================================= */

async function readUser(code) {


    const url =

        `${DATABASE_URL}/${USERS_PATH}/${encodeURIComponent(code)}.json`;


    const response =
        await fetch(
            url,
            {
                method: "GET",

                cache: "no-store",

                headers: {
                    "Accept":
                        "application/json"
                }
            }
        );


    if (!response.ok) {


        throw new Error(
            "FIREBASE_READ_FAILED"
        );


    }


    return await response.json();

}



/* =========================================================
   التحقق من حالة الحساب
========================================================= */

function isAccountDisabled(user) {


    if (
        user.active === false
    ) {

        return true;

    }


    const status =
        String(
            user.status || ""
        )
        .trim()
        .toLowerCase();


    const blockedStatuses = [

        "inactive",
        "disabled",
        "blocked",
        "banned",
        "suspended"

    ];


    return blockedStatuses.includes(
        status
    );

}



/* =========================================================
   حفظ الجلسة
========================================================= */

function saveSession(
    code,
    user
) {


    const session = {


        code:
            code,


        role:
            user.role || "",


        name:
            user.name || "",


        loginTime:
            Date.now()


    };


    sessionStorage.setItem(

        "tahadi_session",

        JSON.stringify(
            session
        )

    );


    sessionStorage.setItem(

        "tahadi_code",

        code

    );


    sessionStorage.setItem(

        "tahadi_role",

        String(
            user.role || ""
        )

    );

}



/* =========================================================
   تحديد الصفحة حسب الصلاحية
========================================================= */

function redirectByRole(role) {


    const userRole =

        String(role || "")

            .trim()

            .toLowerCase();



    switch (userRole) {


        /* =============================================
           الإدارة
        ============================================= */

        case "admin":

        case "administrator":

        case "add":


            window.location.replace(
                "add.html"
            );


            return;



        /* =============================================
           الطالب / الطالبة
        ============================================= */

        case "student":

        case "st":


            window.location.replace(
                "st.html"
            );


            return;



        /* =============================================
           الأستاذ / المدرسة
        ============================================= */

        case "teacher":

        case "th":


            window.location.replace(
                "th.html"
            );


            return;



        /* =============================================
           مشرف الحضور والغيابات
        ============================================= */

        case "attendance":

        case "attendance_supervisor":

        case "supervisor":

        case "msh":


            window.location.replace(
                "msh.html"
            );


            return;



        default:


            throw new Error(
                "UNKNOWN_ROLE"
            );


    }

}



/* =========================================================
   تسجيل الدخول
========================================================= */

async function login() {


    if (loginRunning) {

        return;

    }


    hideMessage();



    /* =====================================================
       الإنترنت
    ===================================================== */

    if (!navigator.onLine) {


        showOfflineScreen();

        return;


    }



    /* =====================================================
       الكود
    ===================================================== */

    const code =

        cleanCode(
            userCodeInput.value
        );



    if (!code) {


        showMessage(
            "يرجى إدخال الكود الخاص بك"
        );


        userCodeInput.focus();


        return;

    }



    setLoginLoading(
        true
    );



    try {



        /* =================================================
           قراءة Firebase
        ================================================= */

        const user =
            await readUser(
                code
            );



        /* =================================================
           الكود غير موجود
        ================================================= */

        if (
            user === null ||
            typeof user !== "object"
        ) {


            showMessage(
                "الكود الذي أدخلته غير صحيح"
            );


            userCodeInput.select();


            return;

        }



        /* =================================================
           الحساب معطل
        ================================================= */

        if (
            isAccountDisabled(user)
        ) {


            showMessage(
                "هذا الحساب غير فعال، يرجى مراجعة الإدارة"
            );


            return;

        }



        /* =================================================
           الصلاحية
        ================================================= */

        if (!user.role) {


            showMessage(
                "بيانات الحساب غير مكتملة، يرجى مراجعة الإدارة"
            );


            return;

        }



        /* =================================================
           حفظ الجلسة
        ================================================= */

        saveSession(
            code,
            user
        );



        /* =================================================
           نجاح
        ================================================= */

        showMessage(

            "تم تسجيل الدخول بنجاح",

            "success"

        );



        /* =================================================
           تحويل المستخدم
        ================================================= */

        setTimeout(() => {


            try {


                redirectByRole(
                    user.role
                );


            }

            catch (error) {


                console.error(
                    error
                );


                showMessage(
                    "نوع الحساب غير معرف في النظام"
                );


                setLoginLoading(
                    false
                );


            }


        }, 450);



    }

    catch (error) {



        console.error(
            "Login Error:",
            error
        );



        if (!navigator.onLine) {


            showOfflineScreen();


        }

        else {


            showMessage(
                "تعذر الاتصال بقاعدة البيانات، حاول مرة أخرى"
            );


        }



    }

    finally {



        setTimeout(() => {


            if (
                document.visibilityState ===
                "visible"
            ) {


                setLoginLoading(
                    false
                );


            }


        }, 700);



    }

}

);



/* =========================================================
   تنظيف الكود أثناء الكتابة
========================================================= */

userCodeInput.addEventListener(

    "input",

    function() {


        hideMessage();


        let value =
            this.value;


        /* تحويل الأرقام العربية إلى إنجليزية */

        const arabicNumbers =
            "٠١٢٣٤٥٦٧٨٩";


        const persianNumbers =
            "۰۱۲۳۴۵۶۷۸۹";


        value =
            value.replace(
                /[٠-٩]/g,
                number =>
                    arabicNumbers.indexOf(
                        number
                    )
            );


        value =
            value.replace(
                /[۰-۹]/g,
                number =>
                    persianNumbers.indexOf(
                        number
                    )
            );


        /* حذف الفراغات */

        value =
            value.replace(
                /\s+/g,
                ""
            );


        /* حروف كبيرة */

        value =
            value.toUpperCase();


        this.value =
            value;


    }

);

/* =========================================================
   دعم تشغيل الصوت بعد أول لمسة
   في الأجهزة التي تمنع التشغيل التلقائي
========================================================= */

let firstInteraction =
    false;


function enableAudioAfterInteraction() {


    if (firstInteraction) {

        return;

    }


    firstInteraction =
        true;


    if (
        startupSound &&
        startupSound.paused &&
        startupSound.currentTime === 0
    ) {


        startupSound.volume =
            0.45;


        const request =
            startupSound.play();


        if (request) {


            request
                .then(() => {


                    setTimeout(() => {


                        startupSound.pause();


                    }, 800);


                })
                .catch(() => {});


        }


    }


}


document.addEventListener(

    "touchstart",

    enableAudioAfterInteraction,

    {
        once: true
    }

);


document.addEventListener(

    "click",

    enableAudioAfterInteraction,

    {
        once: true
    }

);



/* =========================================================
   تشغيل التطبيق
========================================================= */

window.addEventListener(

    "load",

    function() {


        if (!navigator.onLine) {


            showOfflineScreen();


        }

        else {


            playSplash();


        }


    }

);
